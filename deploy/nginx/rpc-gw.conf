# RPC-1: rpc-gw.0xainet.top 公网 HTTPS 入口 → chain-rpc 网关 :9130
# 证书由 certbot --nginx 自动签发/续期（HTTP-01，80 端口已监听）
# 应用：sudo cp deploy/nginx/rpc-gw.conf /etc/nginx/sites-available/rpc-gw
#       sudo ln -s /etc/nginx/sites-available/rpc-gw /etc/nginx/sites-enabled/
#       sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name rpc-gw.0xainet.top;
    # ACME HTTP-01 challenge（certbot 自动管理）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name rpc-gw.0xainet.top;

    ssl_certificate     /etc/letsencrypt/live/rpc-gw.0xainet.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rpc-gw.0xainet.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # 客户端体上限（广播交易/批量请求）
    client_max_body_size 2m;

    # 核心 RPC 路由（读/广播/订阅三通道）
    location ~ ^/v1/(rpc|broadcast|subscription)/([a-z0-9]+)$ {
        proxy_pass http://127.0.0.1:9130;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-API-Key $http_x_api_key;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # WS 订阅（RPC-7）
    location /v1/ws {
        proxy_pass http://127.0.0.1:9130;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-API-Key $http_x_api_key;
        proxy_read_timeout 3600s;
    }

    # 公开元信息（无 key）
    location ~ ^/(v1/status|v1/plans|health|$|v1/planinfo) {
        proxy_pass http://127.0.0.1:9130;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://127.0.0.1:9130;
        proxy_set_header Host $host;
    }
}
