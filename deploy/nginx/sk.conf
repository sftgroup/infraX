# A-15: sk.0xainet.top 公网 HTTPS 入口 → session-key engine :3500
# 证书由 certbot --nginx 自动签发/续期（HTTP-01）
# 应用：sudo cp deploy/nginx/sk.conf /etc/nginx/sites-available/sk
#       sudo ln -s /etc/nginx/sites-available/sk /etc/nginx/sites-enabled/
#       sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name sk.0xainet.top;
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name sk.0xainet.top;

    # SAN 证书（rpc-gw.0xainet.top + sk.0xainet.top 同一张，certbot 存于 rpc-gw 目录）
    ssl_certificate     /etc/letsencrypt/live/rpc-gw.0xainet.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rpc-gw.0xainet.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 2m;

    # 托管实例全部端点（health/sessions/nonce/execute/audit 等）
    location / {
        proxy_pass http://127.0.0.1:3500;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }
}
