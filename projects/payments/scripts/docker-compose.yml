# Local AgentX payment harness — infrastructure
#   db     : PostgreSQL 16 (Gateway state)
#   anvil  : local dev chain (chain-id 11155111, 1s blocks) for chain / x402 rails
# Usage:  docker compose up -d db anvil
services:
  db:
    image: postgres:16-alpine
    container_name: agentx-local-db
    environment:
      POSTGRES_USER: agentx
      POSTGRES_PASSWORD: agentx
      POSTGRES_DB: agentx_local
    ports:
      - "${PG_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentx -d agentx_local"]
      interval: 2s
      timeout: 3s
      retries: 30

  anvil:
    image: ghcr.io/foundry-rs/foundry:stable
    container_name: agentx-local-anvil
    entrypoint: ["anvil"]
    command:
      - --host
      - "0.0.0.0"
      - --port
      - "8545"
      - --chain-id
      - "11155111"
      # No --block-time → anvil mines a block per transaction, so payment
      # receipts are available immediately (the Gateway verifies tx right
      # after sending).
    ports:
      - "${ANVIL_PORT:-8545}:8545"
    healthcheck:
      # foundry image has no curl/wget/nc → use bash /dev/tcp (RPC listens as
      # soon as anvil starts, which is synchronous).
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8545'"]
      interval: 2s
      timeout: 3s
      retries: 30
