version: "3.8"

services:
  lightrag:
    build: .
    container_name: lightrag-microservice
    ports:
      - "9721:9721"
    volumes:
      - ./data:/app/data
      - ./tenants/tenants.db:/app/tenants/tenants.db
      - ./.env:/app/.env:ro
    environment:
      - STORAGE_MODE=${STORAGE_MODE:-local}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9721/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3

