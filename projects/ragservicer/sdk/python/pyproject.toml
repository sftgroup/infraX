[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lightrag-client"
version = "2.0.0"
description = "Python client SDK for InfraX RAGservicer"
requires-python = ">=3.9"
dependencies = ["requests>=2.25"]

[tool.setuptools]
packages = ["lightrag_client"]
